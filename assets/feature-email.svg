<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480">
  <defs>
    <linearGradient id="e-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2FBF9B"/>
      <stop offset="1" stop-color="#3C8FE0"/>
    </linearGradient>
    <clipPath id="e-tile"><rect width="640" height="480" rx="32"/></clipPath>
    <filter id="e-shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0B3D4A" flood-opacity="0.25"/>
    </filter>
  </defs>
  <g clip-path="url(#e-tile)">
    <rect width="640" height="480" fill="url(#e-bg)"/>
    <circle cx="580" cy="420" r="150" fill="#FFFFFF" fill-opacity="0.07"/>

    <!-- Digest chips -->
    <g filter="url(#e-shadow)"><rect x="64" y="104" width="112" height="40" rx="20" fill="#FFFFFF"/></g>
    <text x="120" y="130" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="17" font-weight="600" fill="#1D1D1F">Daily</text>
    <rect x="64" y="156" width="124" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.22" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="1.5"/>
    <text x="126" y="182" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="17" font-weight="600" fill="#FFFFFF">Weekly</text>

    <!-- Envelope -->
    <g filter="url(#e-shadow)">
      <rect x="200" y="226" width="300" height="180" rx="20" fill="#D9EEFF"/>
    </g>
    <rect x="228" y="130" width="244" height="210" rx="16" fill="#FFFFFF"/>
    <rect x="252" y="154" width="120" height="11" rx="5.5" fill="#1D1D1F" fill-opacity="0.85"/>
    <rect x="252" y="173" width="80" height="8" rx="4" fill="#86868B" fill-opacity="0.5"/>
    <polyline points="254,234 290,218 326,226 362,204 398,212 444,196" fill="none" stroke="#F08A24" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="254,262 290,254 326,266 362,248 398,256 444,242" fill="none" stroke="#4C63E0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M200 248 L350 330 L500 248 V386 A20 20 0 0 1 480 406 H220 A20 20 0 0 1 200 386 Z" fill="#FFFFFF"/>
    <path d="M200 386 L310 316 M500 386 L390 316" stroke="#E5E5EA" stroke-width="2" stroke-linecap="round"/>

    <!-- Alert bell -->
    <g filter="url(#e-shadow)"><circle cx="500" cy="150" r="46" fill="#FFFFFF"/></g>
    <g transform="translate(500 152)">
      <path d="M-17 10 H17 L12 3 V-7 A12 12 0 0 0 -12 -7 V3 Z" fill="#FF9F0A"/>
      <circle cx="0" cy="15" r="4.5" fill="#FF9F0A"/>
      <rect x="-2.5" y="-24" width="5" height="6" rx="2.5" fill="#FF9F0A"/>
    </g>
    <circle cx="530" cy="120" r="10" fill="#FF3B30" stroke="#FFFFFF" stroke-width="3"/>
  </g>
</svg>
