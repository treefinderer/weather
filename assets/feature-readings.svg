<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480">
  <defs>
    <linearGradient id="r-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B4FD9"/>
      <stop offset="1" stop-color="#3FA0F5"/>
    </linearGradient>
    <clipPath id="r-tile"><rect width="640" height="480" rx="32"/></clipPath>
    <filter id="r-shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1A1460" flood-opacity="0.28"/>
    </filter>
    <mask id="r-moon">
      <rect width="640" height="480" fill="#FFFFFF"/>
      <circle cx="272" cy="216" r="13" fill="#000000"/>
    </mask>
  </defs>
  <g clip-path="url(#r-tile)">
    <rect width="640" height="480" fill="url(#r-bg)"/>
    <circle cx="560" cy="60" r="140" fill="#FFFFFF" fill-opacity="0.07"/>
    <circle cx="70" cy="430" r="120" fill="#FFFFFF" fill-opacity="0.06"/>

    <!-- Night clock: 12am -->
    <g filter="url(#r-shadow)"><circle cx="200" cy="160" r="92" fill="#1B2160"/></g>
    <g stroke="#C9D2FF" stroke-linecap="round">
      <line x1="200" y1="82" x2="200" y2="96" stroke-width="5"/>
      <line x1="278" y1="160" x2="264" y2="160" stroke-width="3" stroke-opacity="0.6"/>
      <line x1="200" y1="238" x2="200" y2="224" stroke-width="3" stroke-opacity="0.6"/>
      <line x1="122" y1="160" x2="136" y2="160" stroke-width="3" stroke-opacity="0.6"/>
    </g>
    <line x1="200" y1="160" x2="200" y2="104" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
    <line x1="200" y1="160" x2="200" y2="124" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round"/>
    <circle cx="200" cy="160" r="7" fill="#FFFFFF"/>
    <circle cx="262" cy="222" r="24" fill="#2A3285" stroke="#FFFFFF" stroke-width="3"/>
    <circle cx="262" cy="222" r="12" fill="#EEF2FF" mask="url(#r-moon)"/>

    <!-- Day clock: 12pm -->
    <g filter="url(#r-shadow)"><circle cx="440" cy="160" r="92" fill="#FFFFFF"/></g>
    <g stroke="#1D1D1F" stroke-linecap="round">
      <line x1="440" y1="82" x2="440" y2="96" stroke-width="5" stroke-opacity="0.8"/>
      <line x1="518" y1="160" x2="504" y2="160" stroke-width="3" stroke-opacity="0.35"/>
      <line x1="440" y1="238" x2="440" y2="224" stroke-width="3" stroke-opacity="0.35"/>
      <line x1="362" y1="160" x2="376" y2="160" stroke-width="3" stroke-opacity="0.35"/>
    </g>
    <line x1="440" y1="160" x2="440" y2="104" stroke="#1D1D1F" stroke-width="6" stroke-linecap="round"/>
    <line x1="440" y1="160" x2="440" y2="124" stroke="#1D1D1F" stroke-width="9" stroke-linecap="round"/>
    <circle cx="440" cy="160" r="7" fill="#1D1D1F"/>
    <circle cx="502" cy="222" r="24" fill="#FFD76A" stroke="#FFFFFF" stroke-width="3"/>
    <g stroke="#E39A12" stroke-width="2.5" stroke-linecap="round">
      <line x1="502" y1="208" x2="502" y2="212"/><line x1="502" y1="232" x2="502" y2="236"/>
      <line x1="488" y1="222" x2="492" y2="222"/><line x1="512" y1="222" x2="516" y2="222"/>
    </g>
    <circle cx="502" cy="222" r="6" fill="#F5A623"/>

    <!-- Two sources card -->
    <g filter="url(#r-shadow)"><rect x="110" y="300" width="420" height="132" rx="22" fill="#FFFFFF"/></g>
    <circle cx="146" cy="338" r="9" fill="#14B8A6"/>
    <rect x="166" y="333" width="130" height="10" rx="5" fill="#1D1D1F" fill-opacity="0.8"/>
    <rect x="306" y="333" width="70" height="10" rx="5" fill="#86868B" fill-opacity="0.45"/>
    <text x="494" y="347" text-anchor="end" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="26" font-weight="600" fill="#1D1D1F">18°</text>
    <line x1="134" y1="366" x2="506" y2="366" stroke="#E5E5EA" stroke-width="1.5"/>
    <circle cx="146" cy="396" r="9" fill="#FF7A59"/>
    <rect x="166" y="391" width="104" height="10" rx="5" fill="#1D1D1F" fill-opacity="0.8"/>
    <rect x="280" y="391" width="90" height="10" rx="5" fill="#86868B" fill-opacity="0.45"/>
    <text x="494" y="405" text-anchor="end" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="26" font-weight="600" fill="#1D1D1F">17°</text>
  </g>
</svg>
