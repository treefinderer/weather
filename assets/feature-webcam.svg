<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480">
  <defs>
    <linearGradient id="w-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5CBF5A"/>
      <stop offset="1" stop-color="#1E9BAE"/>
    </linearGradient>
    <linearGradient id="w-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC27A"/>
      <stop offset="0.55" stop-color="#F58A8F"/>
      <stop offset="1" stop-color="#9C7BE3"/>
    </linearGradient>
    <clipPath id="w-tile"><rect width="640" height="480" rx="32"/></clipPath>
    <clipPath id="w-screen"><rect x="248" y="100" width="328" height="216" rx="14"/></clipPath>
    <filter id="w-shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0B4A3A" flood-opacity="0.25"/>
    </filter>
  </defs>
  <g clip-path="url(#w-tile)">
    <rect width="640" height="480" fill="url(#w-bg)"/>
    <circle cx="590" cy="420" r="150" fill="#FFFFFF" fill-opacity="0.07"/>
    <circle cx="60" cy="60" r="120" fill="#FFFFFF" fill-opacity="0.06"/>

    <!-- Rooftop and pole -->
    <rect x="24" y="430" width="250" height="80" rx="10" fill="#FFFFFF" fill-opacity="0.2"/>
    <g stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="3" stroke-linecap="round">
      <line x1="36" y1="410" x2="262" y2="410"/>
      <line x1="48" y1="410" x2="48" y2="430"/><line x1="96" y1="410" x2="96" y2="430"/>
      <line x1="196" y1="410" x2="196" y2="430"/><line x1="248" y1="410" x2="248" y2="430"/>
    </g>
    <rect x="118" y="262" width="12" height="172" rx="4" fill="#FFFFFF" fill-opacity="0.9"/>
    <rect x="104" y="424" width="40" height="10" rx="4" fill="#FFFFFF" fill-opacity="0.9"/>

    <!-- View cone -->
    <polygon points="178,237 232,132 232,340" fill="#FFFFFF" fill-opacity="0.14"/>

    <!-- Camera -->
    <g transform="translate(124 250) rotate(-10)">
      <rect x="-8" y="10" width="16" height="22" rx="4" fill="#FFFFFF"/>
      <g filter="url(#w-shadow)"><rect x="-44" y="-28" width="96" height="50" rx="14" fill="#FFFFFF"/></g>
      <rect x="-52" y="-38" width="112" height="14" rx="7" fill="#E8EAF2"/>
      <circle cx="54" cy="-3" r="19" fill="#1D1D1F" stroke="#FFFFFF" stroke-width="3"/>
      <circle cx="54" cy="-3" r="8" fill="#4C63E0"/>
      <circle cx="57" cy="-6" r="2.5" fill="#FFFFFF"/>
      <circle cx="-26" cy="-3" r="5" fill="#FF3B30"/>
      <rect x="-12" y="-6" width="34" height="6" rx="3" fill="#D2D8EA"/>
    </g>

    <!-- Player window -->
    <g filter="url(#w-shadow)"><rect x="232" y="84" width="360" height="300" rx="22" fill="#FFFFFF"/></g>
    <rect x="248" y="100" width="328" height="216" rx="14" fill="url(#w-sky)"/>
    <g clip-path="url(#w-screen)">
      <circle cx="476" cy="236" r="36" fill="#FFE08A"/>
      <g fill="#FFFFFF" fill-opacity="0.6">
        <rect x="280" y="150" width="72" height="14" rx="7"/>
        <rect x="302" y="168" width="44" height="10" rx="5"/>
        <rect x="486" y="138" width="62" height="12" rx="6"/>
      </g>
      <g fill="#6E5FC8" fill-opacity="0.6">
        <rect x="248" y="250" width="40" height="70"/>
        <rect x="292" y="226" width="30" height="94"/>
        <rect x="326" y="262" width="44" height="58"/>
        <rect x="372" y="236" width="26" height="84"/>
        <rect x="402" y="256" width="50" height="64"/>
        <rect x="456" y="230" width="34" height="90"/>
        <rect x="494" y="266" width="42" height="54"/>
        <rect x="540" y="244" width="36" height="76"/>
      </g>
      <line x1="321" y1="244" x2="321" y2="222" stroke="#3D3A8C" stroke-width="3"/>
      <g fill="#3D3A8C">
        <rect x="248" y="272" width="52" height="48"/>
        <rect x="304" y="244" width="34" height="76"/>
        <rect x="342" y="282" width="56" height="38"/>
        <rect x="402" y="258" width="38" height="62"/>
        <rect x="444" y="286" width="60" height="34"/>
        <rect x="508" y="262" width="30" height="58"/>
        <rect x="542" y="278" width="34" height="42"/>
      </g>
      <g fill="#FFD76A">
        <rect x="312" y="256" width="6" height="8" rx="1"/><rect x="324" y="256" width="6" height="8" rx="1"/>
        <rect x="312" y="276" width="6" height="8" rx="1"/><rect x="324" y="296" width="6" height="8" rx="1"/>
        <rect x="410" y="270" width="6" height="8" rx="1"/><rect x="424" y="290" width="6" height="8" rx="1"/>
        <rect x="260" y="284" width="6" height="8" rx="1"/><rect x="516" y="276" width="6" height="8" rx="1"/>
        <rect x="456" y="298" width="6" height="8" rx="1"/><rect x="354" y="294" width="6" height="8" rx="1"/>
      </g>
      <!-- Live badge -->
      <rect x="262" y="114" width="74" height="28" rx="14" fill="#1D1D1F" fill-opacity="0.72"/>
      <circle cx="279" cy="128" r="6" fill="#FF3B30"/>
      <text x="292" y="133" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="0.5" fill="#FFFFFF">LIVE</text>
    </g>
    <rect x="256" y="336" width="140" height="11" rx="5.5" fill="#1D1D1F" fill-opacity="0.85"/>
    <rect x="256" y="355" width="90" height="8" rx="4" fill="#86868B" fill-opacity="0.5"/>
    <rect x="508" y="334" width="60" height="30" rx="15" fill="#F2F4F7"/>
    <path d="M532 356 L545 343 M536 343 H545 V352" fill="none" stroke="#0071E3" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
