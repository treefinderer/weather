<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480">
  <defs>
    <linearGradient id="y-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7A55A"/>
      <stop offset="1" stop-color="#EE6A82"/>
    </linearGradient>
    <linearGradient id="y-area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F08A24" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#F08A24" stop-opacity="0"/>
