    <clipPath id="y-tile"><rect width="640" height="480" rx="32"/></clipPath>
    <filter id="y-shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#6B1E2E" flood-opacity="0.25"/>
    </filter>
  </defs>
